<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resala AUC — 9:16 torn-paper background</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  /* 1080x1920 blank branded background: a torn ivory sheet laid over a royal
     field with sky-blue corners, plus the standard mark vocabulary. No type —
     drop a headline onto .plate, which is the ivory area. */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: var(--r-royal);
    overflow: hidden;
    position: relative;
  }

  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Painted-paper texture on the blue field. The reference blues are not flat
     digital fills — they read as pigment on stock. */
  .field-texture {
    position: absolute; inset: 0;
    opacity: 0.28;
    mix-blend-mode: overlay;
    background-image:
      radial-gradient(rgba(255,255,255,0.5) 1px, transparent 1.6px),
      radial-gradient(rgba(0,0,0,0.4) 1px, transparent 1.6px);
    background-size: 5px 5px, 8px 8px;
    background-position: 0 0, 3px 4px;
    z-index: 2;
  }

  /* Paper grain across the whole piece, over everything. */
  .grain {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(rgba(27,31,35,0.06) 1px, transparent 1px),
      radial-gradient(rgba(27,31,35,0.05) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 2px 2px;
    z-index: 9;
  }

  .sky-tr { position: absolute; top: -6%; right: -8%; width: 58%; z-index: 1; }
  .sky-bl { position: absolute; bottom: -5%; left: -10%; width: 62%; z-index: 1; }

  /* The ivory sheet. The drop is a torn lip, not a box-shadow — this paper
     lies flat on the field rather than floating above it. */
  .plate { position: absolute; inset: 0; z-index: 3; }

  /* Marks: asterisk, two halftone patches, an arrow. Three or four total —
     one in every corner turns the layout to noise. */
  .asterisk { position: absolute; top: 11%; right: 11%; width: 13%; z-index: 5; }
  .arrow    { position: absolute; bottom: 11%; left: 12%; width: 17%; z-index: 5; }

  .dots {
    position: absolute;
    z-index: 4;
    background-image: radial-gradient(var(--r-royal) 24%, transparent 25%);
    opacity: 0.95;
  }
  /* Rotated so the dots sit on the diagonal, and masked so the field scatters
     out at its edges instead of stopping at a hard rectangle. */
  .dots--l {
    left: 6%; top: 26%; width: 17%; height: 13%;
    background-size: 1.6vmin 1.6vmin;
    transform: rotate(45deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 35%, transparent 100%);
  }
  .dots--r {
    right: 5%; top: 57%; width: 16%; height: 12%;
    background-size: 1.6vmin 1.6vmin;
    transform: rotate(45deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 35%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 35%, transparent 100%);
  }
</style>
</head>

  <div class="dots dots--l" aria-hidden="true"></div>

  <svg class="asterisk" viewBox="0 0 100 100" aria-hidden="true">
