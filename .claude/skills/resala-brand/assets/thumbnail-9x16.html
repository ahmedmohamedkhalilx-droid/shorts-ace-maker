<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resala AUC — 9:16 layered collage</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  /* 1080x1920 layered collage, built to the density of the reference poster:
     overlapping torn paper, several duotone photo cutouts, organic sky blobs,
     halftone patches in two colourways, tape, a torn note and hand marks.

     The failure mode of this brand is a clean, sparse layout that happens to
     use the right hexes — the layering IS the identity. */
  :root {
    --cream:  #FBF4EE;   /* set above target; the grain multiplies it down */
    --royal:  #002377;
    --royal-d:#001A5C;
    --sky:    #96C0F0;
    --yellow: #FAB533;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: var(--cream);
    overflow: hidden; position: relative;
    font-family: "Bebas Neue", "Anton", sans-serif;
  }

  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .grain {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 20;
    opacity: 0.15; mix-blend-mode: multiply;
  }

  .logo { position: absolute; top: 3.4%; left: 6%; width: 13%; z-index: 12; }
  .logo img { display: block; width: 100%; }

  .kicker {
    position: absolute; top: 4%; left: 22%; z-index: 12;
    font-family: "Montserrat", sans-serif;
    font-weight: 600; text-transform: uppercase;
    font-size: 1.62vmin; line-height: 1.5; letter-spacing: 0.09em;
    color: var(--royal);
  }

  /* The reference's power is a huge left-set headline; centring it inside a
     dense collage leaves the type fighting the artwork for the middle. */
  .headline { position: absolute; top: 12.4%; left: 5.5%; z-index: 13; }
  .line {
    display: block;
    color: var(--royal);
    text-transform: uppercase;
    font-size: 19.6vmin;
    line-height: 0.85;
    letter-spacing: 0.004em;
    transform: scaleX(0.96);
    transform-origin: left top;
  }

  .tape {
    position: absolute; left: 6%; top: 36.5%; z-index: 13;
    transform: rotate(-1.6deg);
  }
  .tape-inner {
    display: flex; align-items: center; gap: 1.4vmin;
    padding: 1.5vmin 3vmin 1.5vmin 2.2vmin;
    background: var(--yellow);
  }
  .tape-inner span {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; text-transform: uppercase;
    font-size: 1.72vmin; letter-spacing: 0.06em; line-height: 1.35;
    color: var(--royal);
  }
  .tape-inner svg { width: 2.9vmin; flex: none; }

  .note {
    position: absolute; right: 6%; bottom: 6.5%; z-index: 15;
    width: 33%; transform: rotate(2.5deg);
  }
  .note-inner {
    background: var(--cream);
    padding: 3.4vmin 3vmin 3.8vmin;
    /* Torn along the top and bottom like a strip pulled from a pad. */
    clip-path: polygon(0 6%, 12% 1%, 27% 5%, 44% 0, 61% 4%, 78% 0, 92% 5%, 100% 2%,
                       100% 95%, 86% 100%, 70% 96%, 52% 100%, 35% 96%, 18% 100%, 4% 95%);
  }
  .note-inner p {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: 2.5vmin; line-height: 1.25;
    color: var(--royal);
  }

  .star { position: absolute; z-index: 14; }
  .star--a { top: 8.6%; left: 60%;  width: 12%; }
  .star--b { top: 75.5%; right: 45%; width: 6%; }

  .dots {
    position: absolute; z-index: 6;
    transform: rotate(45deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 24%, rgba(0,0,0,0.5) 64%, transparent 100%);
    mask-image: radial-gradient(closest-side, #000 24%, rgba(0,0,0,0.5) 64%, transparent 100%);
  }
  /* Two colourways: royal dots read on cream, sky dots read on royal. */
  .dots--royal { background-image: radial-gradient(var(--royal) 25%, transparent 26%); }
  .dots--sky   { background-image: radial-gradient(var(--sky) 27%, transparent 28%); }

  .dots--a { left: 2%;   top: 44%;   width: 23%; height: 15%; background-size: 1.9vmin 1.9vmin; }
  .dots--b { right: 2%;  top: 33.5%; width: 17%; height: 11%; background-size: 1.7vmin 1.7vmin; z-index: 11; }
  .dots--c { left: 21%;  top: 66%;   width: 17%; height: 11%; background-size: 1.7vmin 1.7vmin; }
  .dots--d { right: 26%; bottom: 1%; width: 16%; height: 10%; background-size: 1.7vmin 1.7vmin; z-index: 16; }

  .ticks { position: absolute; right: 8%; top: 71%; width: 7%; z-index: 14; }
  .arrow { position: absolute; left: 53%; bottom: 17.5%; width: 13%; z-index: 14; }
</style>
</head>
<body>

  <svg class="art" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="t1" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="5" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="t2" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.023" numOctaves="5" seed="61" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="t3" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.017 0.026" numOctaves="4" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="21" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <mask id="mA"><path fill="#fff" filter="url(#t1)" d="M604,54 L1140,20 L1140,690 L620,650 Z"/></mask>
      <mask id="mB"><path fill="#fff" filter="url(#t2)" d="M372,762 L1140,706 L1140,1360 L392,1316 Z"/></mask>
      <mask id="mC"><path fill="#fff" filter="url(#t3)" d="M96,1392 L646,1358 L660,1806 L110,1782 Z"/></mask>
    </defs>

    <!-- Organic sky blobs: the soft layer the harder shapes sit against -->
    <g filter="url(#t2)">
      <path fill="#96C0F0" d="M470,300 C560,220 690,250 742,330 C800,420 742,520 640,548
                              C540,576 452,520 442,436 C434,368 440,326 470,300 Z"/>
      <path fill="#96C0F0" d="M300,1180 C392,1120 470,1168 486,1244 C502,1326 430,1392 340,1382
                              C258,1372 214,1300 240,1234 C258,1190 274,1196 300,1180 Z"/>
      <path fill="#96C0F0" d="M120,880 C210,830 320,868 348,948 C378,1034 320,1116 224,1128
                              C132,1140 56,1082 56,1000 C56,940 78,904 120,880 Z"/>
    </g>

    <!-- Royal field down the right, torn along its left edge -->
    <g filter="url(#t1)">
      <path fill="#002377" d="M700,-40 L1140,-40 L1140,760 L676,724 L724,420 L662,190 Z"/>
    </g>

    <!-- Royal blob bottom-left and the deep field bottom-right -->
    <g filter="url(#t2)">
      <path fill="#002377" d="M-40,1476 C90,1430 250,1462 322,1560 C400,1666 372,1810 250,1880
                              C150,1938 -20,1930 -40,1900 Z"/>
      <path fill="#001A5C" d="M560,1712 L1140,1660 L1140,1960 L540,1960 Z"/>
    </g>

    <!-- Photo cutouts. Each carries a torn cream lip so it reads as paper laid
         down rather than a rectangle dropped in. -->
    <path fill="#FBF4EE" filter="url(#t1)" d="M592,42 L1150,8 L1150,702 L610,662 Z"/>
    <image href="./photo-a.png" x="604" y="20" width="546" height="670"
           preserveAspectRatio="xMidYMid slice" mask="url(#mA)"/>

    <path fill="#FBF4EE" filter="url(#t2)" d="M360,750 L1150,694 L1150,1372 L380,1328 Z"/>
    <image href="./photo-b.png" x="372" y="706" width="778" height="654"
           preserveAspectRatio="xMidYMid slice" mask="url(#mB)"/>

    <path fill="#FBF4EE" filter="url(#t3)" d="M84,1380 L658,1346 L672,1818 L98,1794 Z"/>
    <image href="./photo-c.png" x="96" y="1358" width="564" height="448"
           preserveAspectRatio="xMidYMid slice" mask="url(#mC)"/>
  </svg>

  <svg class="grain" aria-hidden="true">
    <filter id="g1">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g1)"/>
  </svg>

  <div class="dots dots--royal dots--a" aria-hidden="true"></div>
  <div class="dots dots--sky   dots--b" aria-hidden="true"></div>
  <div class="dots dots--royal dots--c" aria-hidden="true"></div>
  <div class="dots dots--sky   dots--d" aria-hidden="true"></div>

  <div class="logo"><img src="./logo.png" alt="Resala AUC"></div>

  <div class="kicker">365 days of serving.<br>Empowering.<br>Inspiring.</div>

  <div class="headline">
    <span class="line">Sa3a</span>
    <span class="line">We Nos.</span>
  </div>

  <div class="tape">
    <div class="tape-inner">
      <svg viewBox="0 0 24 22" aria-hidden="true">
        <path fill="#002377" d="M12 21C6 16.5 1 12.8 1 8.2 1 4.8 3.6 2 7 2c2 0 3.9 1 5 2.6C13.1 3 15 2 17 2c3.4 0 6 2.8 6 6.2 0 4.6-5 8.3-11 12.8Z"/>
      </svg>
      <span>Together, we can<br>make a difference.</span>
    </div>
  </div>

  <svg class="star star--a" viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="#FAB533" stroke-width="9" stroke-linecap="round">
      <path d="M50 4 L50 96"/><path d="M11 18 L89 82"/>
      <path d="M89 18 L11 82"/><path d="M4 50 L96 50"/>
    </g>
  </svg>
  <svg class="star star--b" viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="#FAB533" stroke-width="13" stroke-linecap="round">
      <path d="M50 6 L50 94"/><path d="M14 21 L86 79"/><path d="M86 21 L14 79"/>
    </g>
  </svg>

  <svg class="ticks" viewBox="0 0 60 70" fill="none" aria-hidden="true">
    <g stroke="#FAB533" stroke-width="9" stroke-linecap="round">
      <path d="M10 58 L22 12"/><path d="M30 62 L40 16"/><path d="M50 56 L56 26"/>
    </g>
  </svg>

  <div class="note">
    <div class="note-inner"><p>it starts<br>with us.</p></div>
  </div>

  <svg class="arrow" viewBox="0 0 170 110" fill="none" aria-hidden="true">
    <path d="M8 22 C40 8, 74 26, 104 52 C122 68, 136 82, 156 92"
          stroke="#002377" stroke-width="7" stroke-linecap="round"/>
    <path d="M128 94 L160 95 L150 64" stroke="#002377" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

</body>
</html>
