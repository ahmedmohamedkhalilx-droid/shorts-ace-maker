<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resala AUC — 9:16 photo thumbnail</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  /* 1080x1920 story / thumbnail.
     Cream ground, torn blue corners at top-right and bottom-left, and a
     duotone photo cutout pushed right of centre so it sits between them.
     Colours sampled from the printed reference — the brand board's ivory
     reads as white beside the real work. */
  :root {
    --cream:  #FBF4EE;   /* set above target; the grain multiplies it down */
    --royal:  #002377;
    --sky:    #96C0F0;
    --yellow: #FAB533;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: var(--cream);
    overflow: hidden; position: relative;
    font-family: "Anton", "Bebas Neue", sans-serif;
  }

  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .grain {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 8;
    opacity: 0.15; mix-blend-mode: multiply;
  }

  .logo { position: absolute; top: 4.4%; left: 7%; width: 15%; z-index: 6; }
  .logo img { display: block; width: 100%; }

  .headline { position: absolute; top: 16%; left: 7%; z-index: 6; }
  .line {
    display: block;
    color: var(--royal);
    text-transform: uppercase;
    font-size: 17.2vmin;
    line-height: 0.9;              /* condensed caps, set tight */
    letter-spacing: -0.004em;
    /* The reference type is far more condensed than any stock weight; the
       squeeze is part of the look, not a distortion. */
    transform: scaleX(0.86);
    transform-origin: left top;
  }

  /* Sits in the open cream to the left of the photo block. */
  .asterisk { position: absolute; top: 54%; left: 8%; width: 15%; z-index: 6; }
</style>
</head>
<body>

  <svg class="art" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="tear" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.019"
                      numOctaves="5" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="30"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="tear2" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022"
                      numOctaves="5" seed="61" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="26"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- The photo is masked by a torn shape rather than clipped to a
           polygon, so its edge reads as fibre rather than as a cut. -->
      <mask id="photoMask">
        <path fill="#fff" filter="url(#tear)"
              d="M400,884 L1240,850 L1240,1602 L414,1568 Z"/>
      </mask>
    </defs>

    <!-- Top-right torn corner: cream -> white lip -> sky -> royal outward -->
    <g filter="url(#tear2)">
      <path fill="#FFFFFF" d="M648,-40 L1120,462 L1120,432 L672,-40 Z"/>
      <path fill="#002377" d="M660,-40 L1120,-40 L1120,470 Z"/>
      <path fill="#96C0F0" d="M660,-40 L1120,470 L1120,372 L784,-40 Z"/>
    </g>

    <!-- Bottom-left torn corner, mirrored -->
    <g filter="url(#tear2)">
      <path fill="#FFFFFF" d="M-40,1438 L432,1960 L404,1960 L-40,1468 Z"/>
      <path fill="#002377" d="M-40,1450 L420,1960 L-40,1960 Z"/>
      <path fill="#96C0F0" d="M-40,1450 L420,1960 L306,1960 L-40,1552 Z"/>
    </g>

    <!-- Duotone photo block, pushed right of centre and bleeding off the
         right edge so it reads as placed rather than framed. -->
    <path fill="#FFFFFF" filter="url(#tear)"
          d="M390,874 L1250,840 L1250,1612 L404,1578 Z"/>
    <image href="./photo-duotone.png" x="400" y="850" width="820" height="762"
           preserveAspectRatio="xMidYMid slice" mask="url(#photoMask)"/>
  </svg>

  <svg class="grain" aria-hidden="true">
    <filter id="g1">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g1)"/>
  </svg>

  <div class="logo"><img src="./logo.png" alt="Resala AUC"></div>

  <div class="headline">
    <span class="line">Sa3a</span>
    <span class="line">We Nos.</span>
  </div>

  <svg class="asterisk" viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="#FAB533" stroke-width="9" stroke-linecap="round">
      <path d="M50 5 L50 95"/><path d="M12 19 L88 81"/>
      <path d="M88 19 L12 81"/><path d="M5 50 L95 50"/>
    </g>
  </svg>

</body>
</html>
