<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Resala AUC">
  <!--
    REDRAWN PLACEHOLDER — not the official Resala AUC logo file.

    Reconstructed from the brand reference images: circular badge, royal ring,
    RESALA arced over the top, AUC under the bottom, white dove carrying an
    envelope on a royal disc. Proportions and the dove are an approximation.

    Replace this whole file with the official asset and every template that
    references ./logo.svg picks it up — nothing else needs editing.
  -->
  <defs>
    <path id="arc-top" d="M100,100 m-78,0 a78,78 0 1,1 156,0" fill="none"/>
    <!-- Radius kept outside the inner disc so AUC sits on ivory, not royal
         on royal. -->
    <path id="arc-bottom" d="M20,100 a80,80 0 0,0 160,0" fill="none"/>
  </defs>

  <!-- Badge -->
  <circle cx="100" cy="100" r="98" fill="#FDF9F3"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#0C2C80" stroke-width="3"/>
  <circle cx="100" cy="100" r="59" fill="#0C2C80"/>

  <!-- Ring lettering -->
  <text font-family="Montserrat, system-ui, sans-serif" font-weight="700"
        font-size="25" letter-spacing="2.5" fill="#0C2C80">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">RESALA</textPath>
  </text>
  <text font-family="Montserrat, system-ui, sans-serif" font-weight="700"
        font-size="16" letter-spacing="4" fill="#0C2C80">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">AUC</textPath>
  </text>

  <!-- Dove carrying an envelope -->
  <g transform="translate(100,100) scale(0.85) translate(-100,-100)">
  <g fill="#FDF9F3">
    <!-- upper wing, swept back over the body -->
    <path d="M96 74 C82 52, 60 46, 44 56 C58 60, 66 68, 72 80 C78 90, 88 94, 98 90 Z"/>
    <!-- body and tail -->
    <path d="M98 88 C112 84, 128 90, 138 82 C134 94, 126 102, 114 106
             C104 110, 92 108, 84 100 C78 94, 84 88, 90 87 Z"/>
    <!-- lower wing -->
    <path d="M92 100 C80 106, 66 108, 54 102 C64 116, 80 122, 94 116
             C100 113, 100 105, 96 101 Z"/>
    <!-- head -->
    <circle cx="136" cy="80" r="9"/>
  </g>
  <!-- beak -->
  <path d="M144 78 L156 81 L144 85 Z" fill="#EAC262"/>
  <!-- eye -->
  <circle cx="139" cy="78" r="1.9" fill="#0C2C80"/>

  <!-- envelope in the dove's grasp -->
  <g transform="rotate(-8 106 124)">
    <rect x="88" y="112" width="36" height="24" rx="1.5" fill="#FDF9F3" stroke="#0C2C80" stroke-width="2"/>
    <path d="M88 113 L106 126 L124 113" fill="none" stroke="#0C2C80" stroke-width="2"/>
  </g>
  </g>
</svg>
